spring.application.name=eCommerce

# Google client-id / client-secret live here. This file is git-ignored - never commit it.
spring.config.import=optional:classpath:application-secrets.properties

# ---------- Database ----------
spring.datasource.url=jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Lazy associations must be loaded inside the service transaction, not while rendering the response.
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ---------- JWT (RS256) ----------
# Generate a local key pair with the commands in README.md -> "Local security setup".
app.security.jwt.private-key=${JWT_PRIVATE_KEY:file:./keys/private_key.pem}
app.security.jwt.public-key=${JWT_PUBLIC_KEY:file:./keys/public_key.pem}
app.security.jwt.issuer=smartcart-api
app.security.jwt.expiration=PT1H

# ---------- CORS / SPA ----------
app.security.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:4200}
# Where the browser lands after Google sign-in; the access token is appended as a URL fragment.
app.security.oauth2.authorized-redirect-uri=${FRONTEND_ORIGIN:http://localhost:4200}/oauth2/callback

# ---------- Google OAuth2 ----------
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---------- Paging ----------
spring.data.web.pageable.max-page-size=50
