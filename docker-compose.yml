# SmartCart - the whole stack in one command:   docker compose up --build
#
#   Storefront  http://localhost:4200
#   API         http://localhost:8080   (Swagger: /swagger-ui.html)
#   Postgres    localhost:5433          (host port 5433 so it doesn't clash with a locally installed Postgres)
#
# Settings come from the .env file next to this one (copy .env.example to .env).

name: smartcart

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce}
    volumes:
      # Runs ONCE, only when the db-data volume is empty: recreates the schema + data from the snapshot.
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
      # Where Postgres keeps its files, so data survives `docker compose down` / restarts.
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend/eCommerce
    depends_on:
      db:
        condition: service_healthy   # don't start Spring Boot until Postgres accepts connections
    environment:
      DB_URL: db                     # the service name above is the hostname inside the Docker network
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce}
      FRONTEND_ORIGIN: http://localhost:4200
      # Without real values the app still runs; only "Sign in with Google" won't work.
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
    volumes:
      - jwt-keys:/app/keys           # key pair is generated on first start and reused afterwards
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend/eCommerce-client
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  db-data:
  jwt-keys:
