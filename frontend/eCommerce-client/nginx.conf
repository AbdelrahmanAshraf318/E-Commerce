server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routes (/cart, /login, /oauth2/callback, ...) only exist in the browser:
    # serve index.html for any path that isn't a real file and let the Angular router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS file names contain a content hash, so they can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|ico|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
